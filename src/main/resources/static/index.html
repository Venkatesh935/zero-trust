<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Trust | Website Security</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/charts.js" defer></script>
    <script src="/js/scan-view.js" defer></script>
    <script src="/js/pages/dashboard.js" defer></script>
    <script src="/js/pages/targets.js" defer></script>
    <script src="/js/pages/scanner.js" defer></script>
    <script src="/js/pages/findings.js" defer></script>
    <script src="/js/pages/risk.js" defer></script>
    <script src="/js/pages/monitoring.js" defer></script>
    <script src="/js/pages/history.js" defer></script>
    <script src="/js/pages/audit.js" defer></script>
    <script src="/js/pages/reports.js" defer></script>
    <script src="/js/pages/users.js" defer></script>
    <script src="/js/pages/settings.js" defer></script>
    <script src="/js/app.js" defer></script>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/dashboard">
            <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
            <div><div class="brand-name">ZERO TRUST</div><div class="brand-tag">Security Assessment</div></div>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-user" id="sidebarUser"></div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="btn btn-ghost icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Open navigation"></button>
            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p class="subtitle" id="pageSubtitle"></p>
            </div>
            <div class="topbar-right">
                <span class="verify-pill" title="Your session is re-verified against the user database on every request"><span class="pulse"></span><span class="txt">Session verified</span></span>
            </div>
        </header>
        <main class="view" id="view" tabindex="-1">
            <div class="loading"><div class="spinner"></div><span>Verifying session...</span></div>
        </main>
    </div>
</div>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
