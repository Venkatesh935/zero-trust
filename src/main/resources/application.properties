spring.application.name=zero-trust
server.port=8080

# ---------------------------------------------------------------
# MongoDB database. Nothing secret is stored in this file.
#   MONGODB_URI (optional full connection string, e.g. a MongoDB Atlas
#                mongodb+srv:// URI or one containing credentials)
# Default: local MongoDB without authentication, database zero_trust_db
# (created automatically on first write).
# ---------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/zero_trust_db}
spring.mongodb.database=${MONGODB_DATABASE:zero_trust_db}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------
# Session security
# ---------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=ZTSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# Never leak internal details in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------
# Initial administrator (created only when the user table is empty).
# Set ZT_ADMIN_PASSWORD before the first start; otherwise a random
# password is generated and printed once in the console log.
# ---------------------------------------------------------------
zerotrust.admin.username=${ZT_ADMIN_USERNAME:admin}
zerotrust.admin.password=${ZT_ADMIN_PASSWORD:}

# Account lockout after repeated failed logins
zerotrust.security.max-failed-logins=5
zerotrust.security.lockout-minutes=15

# ---------------------------------------------------------------
# Passive scanner limits (SSRF protection and resource limits)
# ---------------------------------------------------------------
zerotrust.scanner.connect-timeout-ms=5000
zerotrust.scanner.read-timeout-ms=8000
zerotrust.scanner.max-header-bytes=65536
zerotrust.scanner.max-redirects=5
zerotrust.scanner.allowed-ports=80,443,8080,8443
zerotrust.scanner.manual-scan-cooldown-seconds=30

# ---------------------------------------------------------------
# Continuous monitoring scheduler
# ---------------------------------------------------------------
zerotrust.monitoring.scheduler-enabled=true
zerotrust.monitoring.poll-interval-ms=60000
zerotrust.monitoring.initial-delay-ms=30000
zerotrust.monitoring.min-interval-minutes=5
zerotrust.monitoring.max-interval-minutes=1440
zerotrust.monitoring.max-checks-per-cycle=3
